name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y efibootmgr
          efibootmgr --version

      - name: Run script
        run: sudo TEST_REF_DIR=/tests/expected-out-ci ./tests/run_chroot_tests.sh

      - name: Zip test logs
        if: always()
        run: zip -r tests-log.zip tests/log

      - name: Upload zipped logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: tests-log.zip